{% extends "base.html" %}
{% block title %}Add Customer — SmartOps{% endblock %}
{% block content %}

<div class="top-bar">
    <h1 class="page-title">➕ Add Customer</h1>
    <a href="{{ url_for('customers') }}" class="btn btn-ghost">← Back</a>
</div>

<div class="card" style="max-width:560px">
    <form method="POST">
        <div class="form-group">
            <label>Full Name *</label>
            <input type="text" name="name" placeholder="e.g. Emeka Okafor" required>
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="phone" placeholder="+234 800 000 0000">
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="customer@example.com">
        </div>
        <div class="form-group">
            <label>Service / Request</label>
            <input type="text" name="request" placeholder="e.g. Logistics delivery, Bulk order...">
        </div>
        <div class="form-group">
            <label>Last Contacted Date</label>
            <input type="date" name="last_contacted" value="{{ today }}">
            <small style="color:#64748b;font-size:0.8rem">Leave blank to use today's date.</small>
        </div>
        <div style="display:flex;gap:0.75rem;margin-top:1rem;">
            <button type="submit" class="btn btn-primary">Save Customer</button>
            <a href="{{ url_for('customers') }}" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
