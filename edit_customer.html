{% extends "base.html" %}
{% block title %}Edit {{ customer.name }} — SmartOps{% endblock %}
{% block content %}

<div class="top-bar">
    <h1 class="page-title">✏️ Edit Customer</h1>
    <a href="{{ url_for('customer_detail', customer_id=customer.id) }}" class="btn btn-ghost">← Back</a>
</div>

<div class="card" style="max-width:560px">
    <form method="POST">
        <div class="form-group">
            <label>Full Name *</label>
            <input type="text" name="name" value="{{ customer.name }}" required>
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="phone" value="{{ customer.phone or '' }}">
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" value="{{ customer.email or '' }}">
        </div>
        <div class="form-group">
            <label>Service / Request</label>
            <input type="text" name="request" value="{{ customer.request or '' }}">
        </div>
        <div class="form-group">
            <label>Last Contacted Date</label>
            <input type="date" name="last_contacted" value="{{ customer.last_contacted.strftime('%Y-%m-%d') }}">
        </div>
        <div style="display:flex;gap:0.75rem;margin-top:1rem;">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('customer_detail', customer_id=customer.id) }}" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
